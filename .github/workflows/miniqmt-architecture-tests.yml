name: MiniQMT architecture tests

on:
  push:
    branches: [master, "refactor/**"]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install numpy pandas
      - run: python -m unittest discover -s Stragety/MiniQMT_Stragety/tests -p "test_*.py" -v
      - run: python -m compileall -q Stragety/MiniQMT_Stragety/daytrading Stragety/MiniQMT_Stragety/DayTradeing_v32_stragety_miniqmt.py
